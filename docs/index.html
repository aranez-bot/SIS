<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Inquiry App</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #657184;
      --line: #dbe2ea;
      --primary: #365bd8;
      --primary-dark: #2545b8;
      --success: #0f8b6f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    .shell {
      width: min(940px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
      gap: 18px;
      align-items: stretch;
    }

    .intro,
    .download {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px;
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 26px;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #e9efff;
      color: var(--primary);
      font-size: 28px;
      font-weight: 900;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 620px;
      margin-bottom: 12px;
      font-size: clamp(2rem, 5vw, 3.6rem);
      line-height: 1.04;
      letter-spacing: 0;
    }

    h2 {
      margin-bottom: 14px;
      font-size: 1.15rem;
    }

    .lead {
      max-width: 600px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 26px;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      font-weight: 800;
      text-decoration: none;
    }

    a.button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    a.button.primary:hover {
      background: var(--primary-dark);
    }

    .phone {
      min-height: 250px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fafdff;
    }

    .phone-face {
      width: 132px;
      height: 220px;
      border: 8px solid #1e293b;
      border-radius: 26px;
      background: #ffffff;
      padding: 22px 14px;
    }

    .app-dot {
      width: 44px;
      height: 44px;
      margin-bottom: 18px;
      border-radius: 8px;
      background: var(--success);
    }

    .line {
      height: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      background: #d9e2ec;
    }

    .line.short {
      width: 64%;
    }

    .meta {
      display: grid;
      gap: 10px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }

    .meta li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.93rem;
    }

    .meta strong {
      color: var(--text);
      text-align: right;
      overflow-wrap: anywhere;
    }

    @media (max-width: 760px) {
      main {
        place-items: start center;
        padding-top: 18px;
      }

      .shell {
        grid-template-columns: 1fr;
      }

      .intro,
      .download {
        padding: 22px;
      }

      .actions a.button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="shell" aria-label="Student Inquiry mobile app download">
      <div class="intro">
        <div class="brand">
          <div class="mark" aria-hidden="true">Q</div>
          <div>
            <strong>Student Inquiry System</strong>
            <p class="lead">Android app release page</p>
          </div>
        </div>

        <h1>Download the student inquiry mobile app.</h1>
        <p class="lead">
          Install the latest Android APK and connect to the hosted Laravel API on Alwaysdata.
        </p>

        <div class="actions">
          <a class="button primary" data-apk-link href="#">Download APK</a>
          <a class="button" data-web-link href="#">Open Web App</a>
        </div>
      </div>

      <aside class="download">
        <div class="phone" aria-hidden="true">
          <div class="phone-face">
            <div class="app-dot"></div>
            <div class="line"></div>
            <div class="line short"></div>
            <div class="line"></div>
          </div>
        </div>

        <h2>Release Details</h2>
        <ul class="meta">
          <li><span>API</span><strong data-api-url></strong></li>
          <li><span>APK</span><strong>GitHub Releases</strong></li>
          <li><span>Platform</span><strong>Android</strong></li>
        </ul>
      </aside>
    </section>
  </main>

  <script>
    const config = {
      apiUrl: 'https://yourname.alwaysdata.net/api',
      webAppUrl: 'https://yourname.alwaysdata.net',
      apkUrl: 'https://github.com/aranez-bot/SIS/releases/latest/download/student-inquiry.apk'
    };

    document.querySelector('[data-apk-link]').href = config.apkUrl;
    document.querySelector('[data-web-link]').href = config.webAppUrl;
    document.querySelector('[data-api-url]').textContent = config.apiUrl;
  </script>
</body>
</html>
